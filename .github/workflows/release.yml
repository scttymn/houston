# A release (docs/plans/releases.md): pushing a tag like v0.1.0 tests Houston,
# then publishes it at that version:
#   - ghcr.io/<owner>/houston-mission-control:<tag> and houston-runner:<tag>
#   - a GitHub Release with the CLI binaries, install.sh and SHA256SUMS
# A server installs or updates with HOUSTON_VERSION=<tag> (install/install.sh).
# Nothing is published unless the tests pass, and the Release comes last, so
# a Release always has its images.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The same commands as locally: the Go toolchain in compose.yml's cli
      # service, and Mission Control in its own compose file.
      - name: Go tests
        run: docker compose --progress quiet run --rm cli go test ./...
      - name: gofmt
        run: |
          unformatted=$(docker compose --progress quiet run --rm cli gofmt -l internal cmd)
          [ -z "$unformatted" ] || { echo "not gofmt'd: $unformatted"; exit 1; }
      - name: Mission Control tests and rubocop
        working-directory: mission_control
        run: docker compose run --rm --no-deps -T -e RAILS_ENV=test app sh -c 'bin/rails test && bin/rubocop'
      - name: Installer
        run: install/test/install-version.sh

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only for now (the plan's "arm64 images later").
      - name: Mission Control
        uses: docker/build-push-action@v7
        with:
          context: mission_control
          target: production
          platforms: linux/amd64
          build-args: |
            HOUSTON_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/houston-mission-control:${{ github.ref_name }}
          push: true
      - name: Runner
        uses: docker/build-push-action@v7
        with:
          context: install
          file: install/runner.Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/houston-runner:${{ github.ref_name }}
          push: true

  release:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: CLI binaries, the installer and SHA256SUMS
        run: |
          docker build --target release --build-arg VERSION="$GITHUB_REF_NAME" --output type=local,dest=dist .
          cp install/install.sh dist/
          (cd dist && sha256sum houston-* install.sh > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
