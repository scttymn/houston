# A finished setup's default backup location. Tests about setup delete it.
unas:
  name: unas-nfs
  kind: nfs
  # Quoted: unquoted JSON is a YAML mapping, and the fixture would store YAML.
  settings: '<%= { server: "10.0.1.20", export: "/volume1/houston" }.to_json %>'

  verified_at: <%= Time.current %>
  acknowledged_at: <%= Time.current %>
  default: true
