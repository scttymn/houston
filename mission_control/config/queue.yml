default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ default ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    # Backups take minutes to hours; one at a time, never in the way of a
    # webhook's change check.
    - queues: [ backups ]
      threads: 1
      processes: 1
      polling_interval: 1
    # Pre-deploy snapshots: a deploy is waiting on each.
    - queues: [ snapshots ]
      threads: 2
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
