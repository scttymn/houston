name: NAME_SET_BY_TEST
services:
  app:
    build: .
    ports: ["8080"]
    environment:
      DB_URL: http://${DB_HOST:-db}:8080/
      APP_SECRET: ${APP_SECRET}
    volumes:
      - .:/app
      - data:/data
    depends_on: [db]
  db:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo db-ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
volumes:
  data:
x-houston:
  health: /up
  commands: { test: 'test ! -e /data/written && test "$$(cat /stage)" = test && wget -qO- "$$DB_URL" | grep -q db-ok && test -n "$$APP_SECRET" && test "$$APP_SECRET" != from-dotenv && test ! -e /app/compose.yml && touch /data/written' }
