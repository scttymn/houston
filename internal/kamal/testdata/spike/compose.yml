# The spike's fixture: a busybox web server that writes the environment it
# received to files, plus a Postgres accessory. install/test/kamal-spike.sh
# deploys it with Kamal using spike.deploy.yml, the generator's output.
name: spike

services:
  app:
    build: { context: ., target: dev }
    ports: ["8080:80"]
    environment:
      PLAIN: "a: b - c # {x} café"
      ERB: "<%= 1 + 1 %>"
      DOLLAR: "cost $$5"
      DB_HOST: ${DB_HOST:-db}
      HOSTILE: ${HOSTILE}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@${DB_HOST:-db}/spike
    volumes:
      - data:/data
    deploy: { resources: { limits: { cpus: "0.5", memory: 256m } } }
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

volumes:
  data:
  pgdata:

x-houston:
  health: /up
  domains: [spike-alias.houston.test]
