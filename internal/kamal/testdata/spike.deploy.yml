service: spike
image: spike
servers:
  web:
    hosts:
      - 127.0.0.1
    options:
      cpus: "0.5"
      memory: 256m
proxy:
  hosts:
    - spike.houston.test
    - spike-alias.houston.test
  ssl: false
  app_port: 80
  healthcheck:
    path: /up
  run:
    publish: false
registry:
  server: 127.0.0.1:5000
  username: houston
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: arm64
ssh:
  user: houston
  keys_only: true
  keys:
    - /ssh/id_ed25519
env:
  clear:
    DB_HOST: spike-db
    DOLLAR: cost $5
    ERB: <%%= 1 + 1 %>
    PLAIN: "a: b - c # {x} café"
  secret:
    - DATABASE_URL:APP__DATABASE_URL
    - HOSTILE
volumes:
  - spike_data:/data
accessories:
  db:
    labels:
      houston.config: 3a4709b73db49a663d1f9e65788c984e7819fe4da2b93b14ec5c829e9a451e0f
    image: postgres:17
    host: 127.0.0.1
    env:
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - spike_pgdata:/var/lib/postgresql/data
    options:
      health-cmd: pg_isready -U postgres
      health-interval: 2s
      health-retries: "30"
