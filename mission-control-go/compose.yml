# Houston's project: gantry dev (houston dev) serves it at
# http://mission-control-go.localhost, gantry test runs its tests, and houston deploy
# puts it on the server.
name: mission-control-go

services:
  app:
    # Built from the module's root (..), where go.mod is.
    build: { context: .., dockerfile: mission-control-go/Dockerfile, target: dev }
    expose: ["8080"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-}   # signs cookies and forms; blank: a key kept in the database
    volumes:
      - ..:/app                    # the module, this app at /app/mission-control-go; rebuilt on change
      - data:/data                 # the SQLite database and uploads

volumes:
  data:

x-houston:
  health: /up
  commands:
    test: sh -c "go vet ./... && go test ./..."
    console: { dev: go run ./cmd/mission-control-go db console, server: /app db console }
